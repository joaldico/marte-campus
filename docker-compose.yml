services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://campus:campus@db:5432/campus?schema=public
      PORT: "3000"
      VIDEO_PROXY: "true"
    ports:
      - "3000:3000"
    expose:
      - "3000"

  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres_data:
